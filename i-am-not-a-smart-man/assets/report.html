<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://cdn.jsdelivr.net 'sha384-qX9VvWkP79m/O121ZE6sOYp0nf/pldQgtvWDbkpzi+3mUo4Wn4Ix4cFzNPay3VaB' 'sha256-xT2RBgOQ5WHp8Xzy7NCINe1D2hIuMXfthWvUuIqYZLc='; style-src 'unsafe-inline'; img-src data:; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>{{TITLE}} — How It Works</title>

    <!-- Mermaid 10.9.6 (MIT), pinned and integrity checked. -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.6/dist/mermaid.min.js"
            integrity="sha384-qX9VvWkP79m/O121ZE6sOYp0nf/pldQgtvWDbkpzi+3mUo4Wn4Ix4cFzNPay3VaB"
            crossorigin="anonymous"></script>

    <style>
        /* ---------------------------------------------------------------
           Base
        --------------------------------------------------------------- */
        :root {
            --bg:        #ffffff;
            --fg:        #1a1a2e;
            --muted:     #6c6c8a;
            --accent:    #3a86ff;
            --border:    #e0e0e8;
            --code-bg:   #f4f4f8;
            --block-bg:  #fafafc;
            --radius:    6px;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html {
            font-size: 17px;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans",
                         "Helvetica Neue", Arial, sans-serif;
            color: var(--fg);
            background: var(--bg);
            line-height: 1.7;
        }

        /* ---------------------------------------------------------------
           Layout
        --------------------------------------------------------------- */
        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        header {
            border-bottom: 2px solid var(--border);
            padding-bottom: 1.25rem;
            margin-bottom: 2.5rem;
        }

        .site-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin: 0 0 0.25rem;
        }

        .subtitle {
            font-size: 1.5rem;
            color: var(--fg);
            margin: 0;
        }

        footer {
            margin-top: 4rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--muted);
        }

        /* ---------------------------------------------------------------
           Typography
        --------------------------------------------------------------- */
        h1 { font-size: 1.8rem; margin: 2.5rem 0 1rem; }
        h2 { font-size: 1.45rem; margin: 2.25rem 0 0.75rem; border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; }
        h3 { font-size: 1.15rem; margin: 1.75rem 0 0.6rem; }
        h4 { font-size: 1rem; margin: 1.5rem 0 0.5rem; }

        p  { margin: 0 0 1rem; }
        li { margin-bottom: 0.35rem; }

        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }

        strong { font-weight: 600; }

        blockquote {
            margin: 1rem 0;
            padding: 0.75rem 1.25rem;
            background: var(--block-bg);
            border-left: 4px solid var(--accent);
            border-radius: var(--radius);
            color: var(--fg);
        }
        blockquote p { margin: 0 0 0.5rem; }
        blockquote p:last-child { margin-bottom: 0; }

        /* ---------------------------------------------------------------
           Code
        --------------------------------------------------------------- */
        code {
            font-family: "Cascadia Code", "Fira Code", "JetBrains Mono",
                         Consolas, "Courier New", monospace;
            font-size: 0.88em;
            background: var(--code-bg);
            padding: 0.15em 0.4em;
            border-radius: 3px;
        }

        pre {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem 1.25rem;
            overflow-x: auto;
            line-height: 1.5;
            margin: 1rem 0 1.5rem;
        }
        pre code {
            background: none;
            padding: 0;
            font-size: 0.85rem;
        }

        /* ---------------------------------------------------------------
           Mermaid diagrams
        --------------------------------------------------------------- */
        pre.mermaid {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            text-align: center;
            overflow-x: auto;
        }

        /* ---------------------------------------------------------------
           Tables
        --------------------------------------------------------------- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0 1.5rem;
            font-size: 0.95rem;
        }
        th, td {
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--border);
            text-align: left;
        }
        th {
            background: var(--code-bg);
            font-weight: 600;
        }

        /* ---------------------------------------------------------------
           Utility
        --------------------------------------------------------------- */
        .highlight { background: var(--code-bg); border-radius: var(--radius); padding: 1rem; overflow-x: auto; }

        hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 2.5rem 0;
        }

        /* Responsive */
        @media (max-width: 600px) {
            html { font-size: 15px; }
            .container { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <p class="site-title">I Am Not A Smart Man</p>
            <p class="subtitle">A plain-language explanation of <strong>{{TITLE}}</strong></p>
        </header>

        <main>
            {{CONTENT}}
        </main>

        <footer>
            <p>Generated by <strong>I Am Not A Smart Man</strong> — because understanding what you built matters.</p>
        </footer>
    </div>

    <script>mermaid.initialize({startOnLoad:true,theme:'neutral',securityLevel:'strict',flowchart:{useMaxWidth:true,htmlLabels:false}});</script>
</body>
</html>
